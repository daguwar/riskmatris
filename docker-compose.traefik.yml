# Run Riskmatris behind an existing Traefik (which handles HTTPS/certificates).
#
# Usage:
#   1. cp .env.example .env   and fill in your values
#   2. docker compose -f docker-compose.traefik.yml up -d --build
#
# The container publishes NO ports – Traefik reaches it via a shared
# Docker network and routes traffic based on the labels below. WebSockets
# (ws/wss) work automatically through Traefik, no extra config needed.
# (Assumes Traefik v2/v3 with the Docker provider enabled.)

services:
  riskmatris:
    build: .
    # Overridable so a second (test) clone on the same host can run in
    # parallel: set RISKMATRIS_CONTAINER_NAME=riskmatris-test in its .env.
    container_name: ${RISKMATRIS_CONTAINER_NAME:-riskmatris}
    # No "ports" here – all traffic goes through Traefik.
    # For local debugging on the server, add: "127.0.0.1:8000:8000"
    volumes:
      - riskmatris_data:/app/data
    environment:
      - RISKMATRIS_DB_PATH=/app/data/riskmatris.db
      - RISKMATRIS_TTL_HOURS=${RISKMATRIS_TTL_HOURS:-48}
      # Trust X-Forwarded-For from Traefik so the rate limiter and logs see
      # the real client IP instead of Traefik's container IP (audit SEC-06).
      # Safe ONLY because the container port is never published: with a
      # directly exposed port, clients could spoof X-Forwarded-For and bypass
      # per-IP rate limits. Never combine FORWARDED_ALLOW_IPS=* with a
      # published "ports:" entry.
      - FORWARDED_ALLOW_IPS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      # Router/service names derive from the container name so that a second
      # (test) instance on the same host gets unique Traefik names; otherwise
      # both instances define a router/service called "riskmatris" and Traefik
      # ends up with a broken router (404 on both domains).
      - "traefik.http.routers.${RISKMATRIS_CONTAINER_NAME:-riskmatris}.rule=Host(`${RISKMATRIS_DOMAIN:?Set RISKMATRIS_DOMAIN in .env}`)"
      - "traefik.http.routers.${RISKMATRIS_CONTAINER_NAME:-riskmatris}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${RISKMATRIS_CONTAINER_NAME:-riskmatris}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      # Service: internal container port (uvicorn listens on 8000); router and
      # service share the name so the router auto-wires to this service.
      - "traefik.http.services.${RISKMATRIS_CONTAINER_NAME:-riskmatris}.loadbalancer.server.port=8000"

networks:
  # The same Docker network your Traefik container is attached to.
  # Common names: traefik-public, traefik_traefik – change in .env if needed.
  # The network must already exist (normally created by Traefik's compose project).
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}

volumes:
  riskmatris_data:
