# Run Riskmatris behind an existing Traefik (which handles HTTPS/certificates).
#
# Usage:
#   1. cp .env.example .env   and fill in your values
#   2. docker compose -f docker-compose.traefik.yml up -d --build
#
# The container publishes NO ports – Traefik reaches it via a shared
# Docker network and routes traffic based on the labels below. WebSockets
# (ws/wss) work automatically through Traefik, no extra config needed.
# (Assumes Traefik v2/v3 with the Docker provider enabled.)

services:
  riskmatris:
    build: .
    container_name: riskmatris
    # No "ports" here – all traffic goes through Traefik.
    # For local debugging on the server, add: "127.0.0.1:8000:8000"
    volumes:
      - riskmatris_data:/app/data
    environment:
      - RISKMATRIS_DB_PATH=/app/data/riskmatris.db
      - RISKMATRIS_TTL_HOURS=48
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      # Router: respond on your domain via the HTTPS entrypoint
      - "traefik.http.routers.riskmatris.rule=Host(`${RISKMATRIS_DOMAIN:?Set RISKMATRIS_DOMAIN in .env}`)"
      - "traefik.http.routers.riskmatris.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.riskmatris.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      # Service: internal container port (uvicorn listens on 8000)
      - "traefik.http.services.riskmatris.loadbalancer.server.port=8000"

networks:
  # The same Docker network your Traefik container is attached to.
  # Common names: traefik-public, traefik_traefik – change in .env if needed.
  # The network must already exist (normally created by Traefik's compose project).
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}

volumes:
  riskmatris_data:
