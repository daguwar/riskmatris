# Kör Riskmatris bakom en befintlig Traefik (som sköter HTTPS/certifikat).
#
# Användning:
#   1. cp .env.example .env   och fyll i dina värden
#   2. docker compose -f docker-compose.traefik.yml up -d --build
#
# Containern publicerar INGA portar – Traefik når den via ett gemensamt
# Docker-nätverk och routar trafik baserat på labels nedan. WebSockets
# (ws/wss) fungerar automatiskt genom Traefik, ingen extra konfig behövs.
# (Förutsätter Traefik v2/v3 med Docker-providern aktiv.)

services:
  riskmatris:
    build: .
    container_name: riskmatris
    # Ingen "ports" här – all trafik går via Traefik.
    # För lokal felsökning på servern, lägg till: "127.0.0.1:8000:8000"
    volumes:
      - riskmatris_data:/app/data
    environment:
      - RISKMATRIS_DB_PATH=/app/data/riskmatris.db
      - RISKMATRIS_TTL_HOURS=48
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      # Router: svara på din domän via HTTPS-entrypointen
      - "traefik.http.routers.riskmatris.rule=Host(`${RISKMATRIS_DOMAIN:?Sätt RISKMATRIS_DOMAIN i .env}`)"
      - "traefik.http.routers.riskmatris.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.riskmatris.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      # Service: intern port i containern (uvicorn lyssnar på 8000)
      - "traefik.http.services.riskmatris.loadbalancer.server.port=8000"

networks:
  # Samma Docker-nätverk som din Traefik-container är ansluten till.
  # Vanliga namn: traefik-public, traefik_traefik – ändra i .env vid behov.
  # Nätverket måste redan finnas (skapas normalt av Traefiks compose-projekt).
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}

volumes:
  riskmatris_data:
