services:
  riskmatris:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - riskmatris_data:/app/data
    environment:
      - RISKMATRIS_DB_PATH=/app/data/riskmatris.db
      - RISKMATRIS_TTL_HOURS=48
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  riskmatris_data:

